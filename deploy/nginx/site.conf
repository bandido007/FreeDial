# nginx site for the API. Install as /etc/nginx/sites-available/algodial and
# symlink into sites-enabled. Certificates: certbot --nginx, or your own.
#
# What it does: TLS, proxies to the gunicorn socket, serves collected static
# files and PUBLIC media directly, limits upload size, passes the client address
# and request id through (set TRUSTED_PROXY_COUNT=1 in .env).

upstream algodial_app {
    server unix:/run/algodial/web.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.org;

    ssl_certificate     /etc/letsencrypt/live/api.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 30m;           # ≥ DATA_UPLOAD_MAX_MB + attachment ceilings
    access_log /var/log/nginx/algodial.access.log;
    error_log  /var/log/nginx/algodial.error.log;

    # Collected static files (admin, GraphiQL): `manage.py collectstatic` writes here.
    location /static/ {
        alias /srv/algodial/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Only the public bucket is served directly; every other file goes through the
    # API (/files/<uid>/), which checks the file's access policy.
    location /media/public/ {
        alias /srv/algodial/media/public/;
        expires 7d;
    }

    # Health probes: cheap, uncached, no logs.
    location = /healthz { proxy_pass http://algodial_app; access_log off; }
    location = /readyz  { proxy_pass http://algodial_app; access_log off; }

    location / {
        proxy_pass http://algodial_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;   # echoed back by the API, on every log line
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
