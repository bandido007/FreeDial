; PostgreSQL realtime driver (res_config_pgsql), used for PJSIP realtime.
; Managed by AlgoDial: deploy/asterisk/ in the AlgoDial repo.
;
; The tables live in AlgoDial's PostgreSQL (docker compose, 127.0.0.1:5442),
; created by Asterisk's own Alembic (`manage.py pjsip_schema`). The role
; 'asterisk' may only read ps_endpoints, ps_auths and ps_aors.

[general]
dbhost=127.0.0.1
dbport=5442
dbname=algodial
dbuser=asterisk
; dbpass lives in a file that is not in git (rule 9: no secrets in git).
#include res_pgsql_secret.conf
requirements=warn
