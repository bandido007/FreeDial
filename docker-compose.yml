# ════════════════════════════════════════════════════════════════════════════
#  Local development services — the app itself runs on the host (`make run`).
#
#    make up      PostgreSQL + Redis + Mailpit        make down      stop them
#
#  Mailpit catches every e-mail the backend sends: http://localhost:8035 (8025/1025 belong to
#  another project's Mailpit on the lab machine)
#  project: every port is published on 127.0.0.1 only, on ports that are free on
#  the lab machine (5432 and 6379 belong to other stacks there).
#  Production is bare metal: see deploy/ and docs/DEPLOYMENT.md.
# ════════════════════════════════════════════════════════════════════════════
name: ${PROJECT_SLUG:-algodial}

services:
  postgres:
    image: postgres:16-alpine
    networks: [algodial]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-algodial}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-algodial}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    networks: [algodial]
    # project: append-only file on, so the command and event streams survive a restart.
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6392}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    networks: [algodial]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8035}:8025"   # web UI
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1035}:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  redis-data:

# project: a network of AlgoDial's own on a fixed subnet nothing else here uses. Left to itself,
# Docker picked 172.17.0.0/16 (19 Oct 2026), the range this laptop's LAN address is in on some
# networks (172.17.18.126), which would cut the laptop off from LAN phones such as 1002.
# 10.242.17.0/24: clear of docker0 (10.220.0.0/24), the other stacks (172.18-25), libvirt
# (192.168.122) and home Wi-Fi (192.168.x). Ports stay published on 127.0.0.1 only.
networks:
  algodial:
    name: algodial-net
    ipam:
      config:
        - subnet: 10.242.17.0/24
