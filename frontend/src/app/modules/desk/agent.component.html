<div class="desk-runtime" data-page="agent" #runtime tabindex="-1">
    <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="i-phone" viewBox="0 0 24 24">
          <path d="M8 3H4a1 1 0 0 0-1 1c0 9 8 17 17 17a1 1 0 0 0 1-1v-4l-5-2-2 3a14 14 0 0 1-7-7l3-2Z" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-5 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" />
        </symbol>
        <symbol id="i-pause" viewBox="0 0 24 24">
          <path d="M9 8v8 M15 8v8 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" />
        </symbol>
        <symbol id="i-minus" viewBox="0 0 24 24">
          <path d="M8 12h8 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0" />
        </symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24">
          <path d="M9 4H5v17h14V4h-4 M9 2h6v5H9Z M8 12h8 M8 16h5" />
        </symbol>
        <symbol id="i-plug" viewBox="0 0 24 24">
          <path d="M7 3v5 M17 3v5 M5 8h14v4a7 7 0 0 1-7 7v3 M3 3l18 18" />
        </symbol>
        <symbol id="i-ring" viewBox="0 0 24 24">
          <path d="M8 6H5v4 M16 6h3v4 M8 14c2-3 6-3 8 0l3-1 2 4-4 2-2-3H9l-2 3-4-2 2-4Z" />
        </symbol>
        <symbol id="i-transfer" viewBox="0 0 24 24">
          <path d="M4 7h14l-4-4 M18 7l-4 4 M20 17H6l4-4 M6 17l4 4" />
        </symbol>
        <symbol id="i-mic" viewBox="0 0 24 24">
          <path d="M9 4a3 3 0 0 1 6 0v8a3 3 0 0 1-6 0Z M5 10v2a7 7 0 0 0 14 0v-2 M12 19v3 M8 22h8" />
        </symbol>
        <symbol id="i-keypad" viewBox="0 0 24 24">
          <path d="M5 4h1 M11 4h1 M17 4h1 M5 10h1 M11 10h1 M17 10h1 M5 16h1 M11 16h1 M17 16h1 M11 22h1" />
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <path
            d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0"
          />
        </symbol>
      </defs>
    </svg>
    <section id="signin" class="signin-panel" hidden>
      <h1 class="ui-logo ui-logo-large"><svg class="ui-logo-symbol" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="ui-logo-ring" d="M17.910 5.167A11 11 0 1 0 26.833 14.090"/><line class="ui-logo-needle" x1="16" y1="16" x2="23.778" y2="8.222"/><circle class="ui-logo-dot" cx="16" cy="16" r="3.5"/><circle class="ui-logo-dot" cx="23.778" cy="8.222" r="4.5"/></svg>
AlgoDial</h1>
      <p class="muted" data-i18n="Sign in to your agent workspace"></p>
      <form id="signin-form" autocomplete="on">
        <label class="field" for="email"
          ><span data-i18n="Email"></span><input id="email" type="email" autocomplete="username" required
        /></label>
        <label class="field" for="password"
          ><span data-i18n="Password"></span
          ><input id="password" type="password" autocomplete="current-password" required
        /></label>
        <label id="otp-row" class="field" for="otp" hidden
          ><span data-i18n="Two-factor code"></span
          ><input id="otp" inputmode="numeric" autocomplete="one-time-code"
        /></label>
        <button type="submit" class="primary" data-i18n="Sign in"></button>
        <p id="signin-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="desk" hidden>
      <header class="top">
        <div class="brand">
          <span class="ui-logo"><svg class="ui-logo-symbol" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="ui-logo-ring" d="M17.910 5.167A11 11 0 1 0 26.833 14.090"/><line class="ui-logo-needle" x1="16" y1="16" x2="23.778" y2="8.222"/><circle class="ui-logo-dot" cx="16" cy="16" r="3.5"/><circle class="ui-logo-dot" cx="23.778" cy="8.222" r="4.5"/></svg>
<strong>AlgoDial</strong></span
          ><small data-i18n="Agent workspace"></small>
        </div>
        <div class="top-actions">
          <span><span id="agent-name"></span> <small id="agent-number"></small></span>
          <div class="language" role="group" aria-label="Language">
            <button data-language="en" aria-pressed="true" lang="en">EN</button
            ><button data-language="sw" aria-pressed="false" lang="sw" title="Swahili labels await Tostao’s review">SW</button>
          </div>
          <button id="theme-toggle" aria-label="Switch colour theme">
            <svg aria-hidden="true"><use href="#i-sun" /></svg>
          </button>
          <button id="signout" data-i18n="Sign out"></button>
        </div>
      </header>
      <section class="statebar" aria-label="Agent status">
        <div class="state-main">
          <svg aria-hidden="true"><use id="state-icon" href="#i-minus" /></svg>
          <div>
            <div id="state-title" class="state-title" role="status"></div>
            <small id="activity"></small><span id="availability" class="sr-only"></span>
          </div>
          <time id="since" class="state-time">00:00</time>
        </div>
        <!-- Named by what it does next ("Go Ready", "Go Not Ready"), so nobody has to guess (UX rule 4). -->
        <button id="state-menu-toggle" class="state-action" aria-expanded="false" aria-controls="state-menu">
          <svg aria-hidden="true"><use id="state-action-icon" href="#i-check" /></svg
          ><span id="state-action"></span
          ><svg id="state-action-caret" class="caret" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></svg
          ><kbd>R</kbd>
        </button>
        <div class="state-load">
          <p id="queue-load"></p>
          <span id="longest-wait"></span>
        </div>
        <div class="health"><span id="phone-chip"></span><small id="live-chip"></small></div>
      </section>
      <section id="state-menu" class="state-menu" hidden>
        <button id="ready" class="primary">
          <svg aria-hidden="true"><use href="#i-check" /></svg><span data-i18n="Go Ready"></span>
        </button>
        <p id="reason-heading" class="menu-heading" data-i18n="Go Not Ready because of:"></p>
        <div id="reason-buttons" class="reason-buttons" role="group" aria-labelledby="reason-heading"></div>
        <button id="enable-notifications" data-i18n="Enable call notifications"></button>
      </section>
      <p id="notice" class="notice error" role="alert" hidden></p>
      <section id="incoming-offer" class="offer" aria-label="Incoming call offer" hidden>
        <div>
          <h2 data-i18n="Incoming call"></h2>
          <h1 id="offer-caller"></h1>
          <small id="offer-meta"></small>
        </div>
        <div>
          <h3 data-i18n="Why they called (AI)"></h3>
          <p id="offer-summary"></p>
          <small id="offer-timeout"></small>
        </div>
        <div class="offer-actions">
          <button id="answer" class="primary">
            <svg aria-hidden="true"><use href="#i-phone" /></svg><span data-i18n="Answer"></span
            ><kbd>Enter</kbd></button
          ><button id="reject" data-i18n="Decline"></button>
          <p id="offer-hint" class="phone-hint" hidden></p>
        </div>
        <progress
          id="ring-progress"
          class="ring-progress"
          max="20"
          value="20"
          aria-label="Time remaining to answer"
        ></progress>
      </section>
      <main class="workspace">
        <section class="zone">
          <h2 data-i18n="The call"></h2>
          <div id="empty-call" class="empty">
            <svg aria-hidden="true"><use id="empty-icon" href="#i-minus" /></svg>
            <h1 id="empty-title"></h1>
            <p id="empty-description" class="muted"></p>
            <button id="empty-ready" class="primary" data-i18n="Go Ready" hidden></button
            ><button id="reconnect" class="primary" data-i18n="Reconnect" hidden></button>
            <!-- UX_PRINCIPLES.md section 4: the last code stays correctable for 2 minutes. -->
            <div id="last-wrap" class="last-wrap" hidden>
              <p><span data-i18n="Last call's wrap-up code:"></span> <strong id="last-wrap-code"></strong></p>
              <label for="last-wrap-select" data-i18n="Change it to"></label>
              <select id="last-wrap-select"></select>
              <button id="last-wrap-save" type="button" data-i18n="Change code"></button>
              <small id="last-wrap-time"></small>
            </div>
          </div>
          <div id="call" hidden>
            <h1 id="caller" class="caller"></h1>
            <small id="caller-name"></small>
            <div class="metadata">
              <span id="caller-language" class="tag"></span><span id="caller-queue" class="tag"></span
              ><span id="caller-wait" class="tag"></span>
            </div>
            <div id="call-time" class="call-time">
              <svg aria-hidden="true"><use href="#i-phone" /></svg><time id="call-timer">00:00</time
              ><span id="call-title" class="muted"></span>
            </div>
            <div id="call-controls" class="controls">
              <button id="hold">
                <svg aria-hidden="true"><use href="#i-pause" /></svg><span data-i18n="Hold"></span
                ><kbd>H</kbd></button
              ><button id="resume" hidden>
                <svg aria-hidden="true"><use href="#i-phone" /></svg><span data-i18n="Resume"></span
                ><kbd>H</kbd></button
              ><button id="mute" aria-pressed="false">
                <svg aria-hidden="true"><use href="#i-mic" /></svg
                ><span id="mute-label" data-i18n="Mute"></span><kbd>M</kbd></button
              ><button id="transfer-toggle" aria-expanded="false" aria-controls="transfer">
                <svg aria-hidden="true"><use href="#i-transfer" /></svg><span data-i18n="Transfer"></span
                ><kbd>T</kbd></button
              ><button id="keypad-toggle" aria-expanded="false" aria-controls="keypad">
                <svg aria-hidden="true"><use href="#i-keypad" /></svg><span data-i18n="Keypad"></span
                ><kbd>K</kbd></button
              ><button id="hangup" class="danger">
                <svg aria-hidden="true"><use href="#i-phone" /></svg><span data-i18n="Hang up"></span
                ><kbd aria-label="Shift plus E">Shift+E</kbd>
              </button>
              <p id="phone-hint" class="phone-hint" hidden></p>
            </div>
            <div id="transfer" class="transfer-form" hidden>
              <label for="transfer-kind" data-i18n="Transfer kind"></label
              ><select id="transfer-kind">
                <option value="blind" data-i18n="Blind transfer"></option>
                <option value="consult" data-i18n="Consult first"></option>
              </select>
              <label for="transfer-target-kind" data-i18n="Transfer to"></label
              ><select id="transfer-target-kind">
                <option value="agent" data-i18n="Agent"></option>
                <option value="queue" data-i18n="Queue"></option>
                <option value="number" data-i18n="Number"></option>
              </select>
              <select id="transfer-agent" aria-label="Agent"></select
              ><select id="transfer-queue" aria-label="Queue" hidden></select
              ><input id="transfer-number" aria-label="Number" hidden />
              <button id="transfer-go" class="primary" data-i18n="Transfer"></button>
            </div>
            <div id="consult" class="transfer-leg" hidden>
              <h3 data-i18n="Caller on hold"></h3>
              <p id="consult-status"></p>
              <div class="transfer-actions">
                <button id="consult-complete" class="primary" data-i18n="Complete"></button
                ><button id="consult-cancel" data-i18n="Cancel"></button
                ><button id="consult-conference" data-i18n="Conference"></button>
              </div>
            </div>
            <div id="conference" class="transfer-leg" hidden>
              <p data-i18n="Conference: you, the caller and the other party"></p>
              <div class="transfer-actions">
                <button id="conference-drop" data-i18n="Drop the other party"></button
                ><button id="conference-leave" class="danger" data-i18n="Leave"></button>
              </div>
            </div>
            <div id="keypad" class="keypad" hidden>
              <label for="digits" data-i18n="Digits"></label
              ><input id="digits" inputmode="tel" pattern="[0-9*#]+" /><button
                id="send-digits"
                data-i18n="Send digits"
              ></button>
            </div>
          </div>
        </section>
        <section class="zone">
          <h2 id="context-heading" data-i18n="Context"></h2>
          <div id="context-empty" class="quiet-context">
            <h3 data-i18n="Everything you need for the next call"></h3>
            <p
              class="muted"
              data-i18n="The caller’s language, topic and AI summary will appear here when a call arrives."
            ></p>
            <p class="muted" data-i18n="Your notes stay alongside the call."></p>
          </div>
          <div id="ai-summary" hidden>
            <h3 data-i18n="Why they called (AI)"></h3>
            <p id="ai-summary-text" class="summary"></p>
            <small id="ai-reason"></small>
            <!-- UX_PRINCIPLES.md section 5: the AI can be wrong; the agent says so in one click. -->
            <div class="ai-feedback">
              <button id="summary-wrong" type="button" data-i18n="Summary wrong"></button
              ><button id="queue-wrong" type="button" data-i18n="Wrong queue"></button>
            </div>
          </div>
          <div id="context-meta" class="context-meta" hidden>
            <div><small data-i18n="Language"></small><strong id="context-language"></strong></div>
            <div><small data-i18n="Topic"></small><strong id="context-topic"></strong></div>
          </div>
          <section id="wrapup" hidden>
            <label class="field" for="wrapup-code"
              ><span data-i18n="Wrap-up code"></span
              ><small
                id="code-required"
                data-i18n="Choose a wrap-up code to finish this call."
              ></small></label
            ><input
              id="wrapup-search"
              type="search"
              data-placeholder="Search wrap-up codes"
              aria-label="Search wrap-up codes"
            /><select id="wrapup-code"></select>
          </section>
          <div id="notes-zone" hidden>
            <label class="field" for="notes" data-i18n="Notes"></label
            ><textarea id="notes" maxlength="8000"></textarea>
            <div class="note-hint">
              <small data-i18n="Keep notes factual and relevant."></small><small id="note-status"></small>
            </div>
          </div>
          <div id="wrapup-actions" class="wrapup-actions" hidden>
            <button id="wrapup-done" class="primary" data-i18n="Finish and go Ready"></button
            ><button id="wrapup-not-ready" data-i18n="Finish and stay Not Ready"></button
            ><label for="wrapup-reason" data-i18n="Not Ready reason"></label
            ><select id="wrapup-reason"></select
            ><small id="wrapup-time"></small>
          </div>
        </section>
        <aside class="zone">
          <details open>
            <summary><strong data-i18n="My queues"></strong></summary>
            <table class="queues">
              <thead>
                <tr>
                  <th scope="col" data-i18n="Queue"></th>
                  <th scope="col" data-i18n="Waiting"></th>
                  <th scope="col" data-i18n="Longest"></th>
                </tr>
              </thead>
              <tbody id="my-queues"></tbody>
            </table>
          </details>
          <section class="day">
            <h2 data-i18n="My day"></h2>
            <div><span data-i18n="Calls handled"></span><strong id="day-calls" class="num">0</strong></div>
            <div><span data-i18n="Average talk time"></span><strong id="day-talk" class="num">—</strong></div>
            <div>
              <span data-i18n="Not ready"></span><strong id="day-not-ready" class="num">00:00</strong>
            </div>
          </section>
        </aside>
      </main>
      <footer class="bottom">
        <span id="action-feedback" role="status"></span>
        <details id="unsaved-notes" class="diagnostics" hidden>
          <summary data-i18n="Unsaved notes from last call"></summary>
          <div class="recovery">
            <label for="recovery-notes" data-i18n="Copy these notes before closing this tab."></label
            ><textarea id="recovery-notes" readonly></textarea
            ><button id="discard-draft" data-i18n="Discard draft"></button>
          </div>
        </details>
        <details class="diagnostics">
          <summary data-i18n="Connection history"></summary>
          <ol id="log"></ol>
        </details>
      </footer>
    </section>
    <audio id="remote-audio" autoplay></audio>
  </div>
