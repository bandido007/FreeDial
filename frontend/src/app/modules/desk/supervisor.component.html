<div class="desk-runtime" data-page="supervisor" #runtime tabindex="-1">
    <section id="signin" class="ui-signin" hidden>
      <h1 class="ui-logo ui-logo-large"><svg class="ui-logo-symbol" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="ui-logo-ring" d="M17.910 5.167A11 11 0 1 0 26.833 14.090"/><line class="ui-logo-needle" x1="16" y1="16" x2="23.778" y2="8.222"/><circle class="ui-logo-dot" cx="16" cy="16" r="3.5"/><circle class="ui-logo-dot" cx="23.778" cy="8.222" r="4.5"/></svg>
AlgoDial</h1>
      <p class="ui-muted" data-i18n="Sign in to your supervisor workspace"></p>
      <form id="signin-form" autocomplete="on">
        <label class="ui-field" for="email"
          ><span data-i18n="Email"></span
          ><input id="email" type="email" autocomplete="username" required /></label
        ><label class="ui-field" for="password"
          ><span data-i18n="Password"></span
          ><input id="password" type="password" autocomplete="current-password" required /></label
        ><label id="otp-row" class="ui-field" for="otp" hidden
          ><span data-i18n="Two-factor code"></span
          ><input id="otp" inputmode="numeric" autocomplete="one-time-code" /></label
        ><button type="submit" class="ui-primary" data-i18n="Sign in"></button>
        <p id="signin-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="desk" hidden>
      <header class="ui-header">
        <a class="ui-brand" href="/supervisor/"
          ><span class="ui-logo"><svg class="ui-logo-symbol" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="ui-logo-ring" d="M17.910 5.167A11 11 0 1 0 26.833 14.090"/><line class="ui-logo-needle" x1="16" y1="16" x2="23.778" y2="8.222"/><circle class="ui-logo-dot" cx="16" cy="16" r="3.5"/><circle class="ui-logo-dot" cx="23.778" cy="8.222" r="4.5"/></svg>
<strong>AlgoDial</strong></span><small data-i18n="Supervisor workspace"></small
        ></a>
        <div class="ui-header-actions">
          <a href="/" id="management-link" hidden data-i18n="Management"></a><span id="me"></span>
          <div class="ui-language" role="group" aria-label="Language">
            <button data-language="en" aria-pressed="true" lang="en">EN</button
            ><button data-language="sw" aria-pressed="false" lang="sw" title="Swahili labels await Tostao’s review">SW</button>
          </div>
          <button data-ui-theme aria-label="Switch colour theme">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0"
              />
            </svg></button
          ><button id="signout" data-i18n="Sign out"></button>
        </div>
      </header>
      <section class="superbar">
        <div class="team-selector">
          <label for="team-filter" data-i18n="Team"></label
          ><select id="team-filter">
            <option value="" data-i18n="All my teams"></option>
          </select>
        </div>
        <div class="metrics">
          <div>
            <span data-i18n="Today’s service level"></span
            ><strong id="service-level" class="ui-number">—</strong>
          </div>
          <div><span data-i18n="Waiting"></span><strong id="waiting-count" class="ui-number">0</strong></div>
          <div>
            <span data-i18n="Longest wait"></span><strong id="longest-wait" class="ui-number">00:00</strong>
          </div>
        </div>
      </section>
      <div id="queues" class="queue-strip" aria-label="Queue snapshot"></div>
      <section id="listening" class="monitor-bar" aria-label="Current supervision" hidden>
        <div><strong id="listening-caller"></strong><small id="listening-mode-help"></small></div>
        <div class="supervision-actions">
          <button id="mode-monitor" data-mode="monitor" data-i18n="Switch to monitor"></button
          ><button id="mode-whisper" data-mode="whisper" data-i18n="Switch to whisper"></button
          ><button id="mode-barge" data-mode="barge" data-i18n="Switch to barge"></button
          ><button id="stop" class="ui-danger" data-i18n="Stop"></button>
        </div>
      </section>
      <p id="notice" class="ui-notice" role="alert" hidden></p>
      <main class="team-panel">
        <div class="team-heading">
          <div>
            <div class="view-tabs" role="tablist" aria-label="Supervisor views"
              ><button id="tab-live" role="tab" aria-selected="true" aria-controls="live-view" data-i18n="Needs attention first"></button
              ><button id="tab-measures" role="tab" aria-selected="false" aria-controls="measures" tabindex="-1" data-i18n="How my team is doing"></button
            ></div>
            <small id="team-summary"></small>
          </div>
          <div class="connection-status">
            <span id="phone-chip" role="status"></span><small id="live-chip" role="status"></small
            ><button id="reconnect" hidden data-i18n="Reconnect"></button>
          </div>
        </div>
        <div id="live-view" role="tabpanel" aria-labelledby="tab-live">
        <div class="team-table">
          <table class="team">
            <thead>
              <tr>
                <th scope="col" data-i18n="Agent"></th>
                <th scope="col" data-i18n="State and reason"></th>
                <th scope="col" data-i18n="Time in state"></th>
                <th scope="col" data-i18n="Current call"></th>
                <th scope="col" data-i18n="Actions"></th>
              </tr>
            </thead>
            <tbody id="agents"></tbody>
          </table>
        </div>
        <p id="no-agents" class="ui-muted" hidden data-i18n="No agents in this team."></p>
        </div>
        <section id="measures" role="tabpanel" aria-labelledby="tab-measures" hidden>
          <div class="measures-bar">
            <div class="ui-language period-choice" role="group" aria-label="Period">
              <button data-period="today" aria-pressed="true" data-i18n="Today"></button
              ><button data-period="last_7_days" aria-pressed="false" data-i18n="Last 7 days"></button>
            </div>
            <small id="measures-note" role="status"></small>
          </div>
          <div id="measure-cards" class="measure-cards"></div>
          <div class="team-table measures-table">
            <table class="team">
              <thead>
                <tr>
                  <th scope="col" data-i18n="Agent"></th>
                  <th scope="col" data-i18n="Answered"></th>
                  <th scope="col" data-i18n="Missed"></th>
                  <th scope="col" data-i18n="Median time to answer"></th>
                  <th scope="col" data-i18n="Median wrap-up"></th>
                  <th scope="col" data-i18n="Transfers completed"></th>
                </tr>
              </thead>
              <tbody id="measure-agents"></tbody>
            </table>
          </div>
        </section>
      </main>
      <footer class="supervisor-footer">
        <span id="update-status" role="status"></span>
        <details>
          <summary data-i18n="Live calls"></summary>
          <div class="live-calls">
            <table>
              <thead>
                <tr>
                  <th scope="col" data-i18n="Caller"></th>
                  <th scope="col" data-i18n="Queue"></th>
                  <th scope="col" data-i18n="State"></th>
                  <th scope="col" data-i18n="Agent"></th>
                  <th scope="col" data-i18n="Time"></th>
                  <th scope="col" data-i18n="Actions"></th>
                </tr>
              </thead>
              <tbody id="calls"></tbody>
            </table>
          </div>
        </details>
      </footer>
      <dialog id="agent-action" aria-labelledby="agent-action-title">
        <form id="agent-action-form">
          <h2 id="agent-action-title"></h2>
          <label for="agent-next-state" data-i18n="State"></label
          ><select id="agent-next-state">
            <option value="ready" data-i18n="Ready"></option>
            <option value="not_ready" data-i18n="Not Ready"></option>
            <option value="logged_out" data-i18n="Sign out"></option></select
          ><label id="action-reason-label" for="agent-reason" data-i18n="Not Ready reason"></label
          ><select id="agent-reason"></select>
          <p id="agent-action-error" class="error" role="alert"></p>
          <div class="dialog-actions">
            <button type="submit" class="ui-primary" data-i18n="Apply change"></button
            ><button type="button" id="agent-action-cancel" data-i18n="Cancel"></button>
          </div>
        </form>
      </dialog>
      <dialog id="history-dialog" aria-labelledby="history-title">
        <h2 id="history-title"></h2>
        <ol id="agent-history"></ol>
        <button id="history-close" data-i18n="Close"></button>
      </dialog>
    </section>
    <audio id="remote-audio" autoplay></audio>
  </div>
