  requestEmailChange(newEmail: String!): UserResponse

  """Authenticated."""
  confirmEmailChange(otp: String!): UserResponse

  """Authenticated."""
  requestPhoneVerification: UserResponse

  """Authenticated."""
  confirmPhoneVerification(otp: String!): UserResponse

  """Authenticated."""
  acceptConsents: UserResponse

  """Authenticated."""
  requestAccountDeletion: UserResponse

  """Authenticated."""
  deleteMyAccount(
