  """Acceptance of the Terms of Service and Privacy Policy"""
  acceptedTerms: Boolean!
}

input ValidateOtpInput {
  email: String!

  """The 6-digit code"""
  otp: String!
}

"""Self-service profile edit (PATCH: omit a field to keep it)."""
input UpdateProfileInput {
  firstName: String
  middleName: String
  lastName: String
  phone: String
  gender: GenderChoices
  photo: String
  dateOfBirth: Date
}

"""
An administrator creates an account; its owner is invited to activate it.
"""
input CreateUserInput {
  email: String!
  firstName: String!
  lastName: String!
  middleName: String
  phone: String
  gender: GenderChoices
  dateOfBirth: Date

  """Defaults to Internal"""
  accountType: AccountTypeChoices

  """Roles the account starts with"""
  roleUids: [UUID]
  sendInvitation: Boolean = true
}

"""An administrator corrects a person's details (PATCH: omit to keep)."""
input UpdateUserInput {
  uid: UUID!
  firstName: String
  middleName: String
  lastName: String
  phone: String
  gender: GenderChoices
  photo: String
  dateOfBirth: Date
  accountType: AccountTypeChoices
}

"""Set the roles a person holds (replace-set)."""
input AssignRolesInput {
  userUid: UUID!
  roleUids: [UUID]!
}
