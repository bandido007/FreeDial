"""The unified root mutation, composed from every app's Mutation."""
type Mutation {
  """
  Start the browser phone for this session. permissions=['can_take_calls']
  """
  startAgentSession: AgentPhoneResponse

  """
  Log out and switch the browser phone off. permissions=['can_take_calls']
  """
  endAgentSession: CommandSentResponse

  """Ready, or Not Ready with a reason. permissions=['can_take_calls']"""
  setMyAvailability(
    ready: Boolean!

    """One of myAgentDesk.notReadyReasons when ready is false"""
    reason: String
  ): CommandSentResponse

  """Hold or resume the current call. permissions=['can_take_calls']"""
  holdMyCall(
    """true: hold (customer hears music); false: resume"""
    hold: Boolean!
  ): CommandSentResponse

  """End wrap-up with a code. permissions=['can_take_calls']"""
  finishMyWrapup(
    """One of myAgentDesk.wrapupCodes"""
    code: String!
  ): CommandSentResponse

  """Create or update a team. permissions=['can_manage_teams']"""
  saveTeam(input: TeamInput!): TeamResponse

  """Remove a team. permissions=['can_manage_teams']"""
  deleteTeam(uid: UUID!): TeamResponse

  """
  Create or update a SIP account. permissions=['can_manage_sip_accounts']
  """
  saveSipAccount(input: SipAccountInput!): SipAccountResponse

  """
  Switch a SIP account on or off. permissions=['can_manage_sip_accounts']
  """
  setSipAccountActive(active: Boolean!, uid: UUID!): SipAccountResponse

  """Remove a SIP account. permissions=['can_manage_sip_accounts']"""
  deleteSipAccount(uid: UUID!): SipAccountResponse

  """permissions=['can_manage_system_settings']"""
  updateSystemSetting(key: String!, value: GenericScalar!): SystemSettingResponse

  """permissions=['can_manage_system_settings']"""
  resetSystemSetting(key: String!): SystemSettingResponse

  """permissions=['can_manage_attachment_settings']"""
  saveAttachmentDefinition(input: AttachmentDefinitionInput!): AttachmentDefinitionResponse

  """permissions=['can_manage_attachment_settings']"""
  deleteAttachmentDefinition(uid: UUID!): AttachmentDefinitionResponse

  """Authenticated (own files)."""
  deleteAttachment(uid: UUID!): AttachmentResponse

  """permissions=['can_manage_endpoint_logs']"""
  resolveEndpointError(note: String, uid: UUID!): RequestLogResponse

  """permissions=['can_manage_endpoint_logs']"""
  resolveSimilarEndpointErrors(note: String, uid: UUID!): ResolvedCountResponse

  """permissions=['can_manage_endpoint_logs']"""
  reopenEndpointError(uid: UUID!): RequestLogResponse

  """permissions=['can_manage_endpoint_logs']"""
  setErrorReportRecipients(userUids: [UUID]!): ErrorReportSubscriptionResponse

  """permissions=['can_manage_endpoint_logs']"""
  sendErrorReportNow: ErrorReportOutcomeResponse

  """permissions=['can_resend_notification']"""
  resendNotification(uid: UUID!): NotificationResponse

  """Authenticated."""
  markInAppNotificationRead(readAll: Boolean = false, uid: UUID): NotificationResponse

  """Authenticated."""
  setMyNotificationPreference(input: NotificationPreferenceInput!): NotificationPreferenceResponse

  """permissions=['can_manage_notification_config']"""
  createEmailConfiguration(input: EmailConfigurationInput!): EmailConfigurationResponse

  """permissions=['can_manage_notification_config']"""
  updateEmailConfiguration(input: EmailConfigurationInput!): EmailConfigurationResponse

  """permissions=['can_manage_notification_config']"""
  deleteEmailConfiguration(uid: UUID!): EmailConfigurationResponse

  """
  permissions=['can_manage_notification_config']: send one test e-mail through a row
  """
  testEmailConfiguration(email: String!, uid: UUID!): NotificationResponse

  """permissions=['can_manage_notification_config']"""
  createSmsConfiguration(input: SmsConfigurationInput!): SmsConfigurationResponse

  """permissions=['can_manage_notification_config']"""
  updateSmsConfiguration(input: SmsConfigurationInput!): SmsConfigurationResponse

  """permissions=['can_manage_notification_config']"""
  deleteSmsConfiguration(uid: UUID!): SmsConfigurationResponse

  """
  permissions=['can_manage_notification_config']: send one test SMS through a gateway row
  """
  testSmsConfiguration(
    """Optional custom text; blank = a default test line"""
    message: String
    phone: String!
    uid: UUID!
  ): NotificationResponse

  """permissions=['can_manage_notification_config']"""
  createNotificationTemplate(input: NotificationTemplateInput!): NotificationTemplateResponse

  """permissions=['can_manage_notification_config']"""
  updateNotificationTemplate(input: NotificationTemplateInput!): NotificationTemplateResponse

  """permissions=['can_manage_notification_config']"""
  deleteNotificationTemplate(uid: UUID!): NotificationTemplateResponse

  """Public."""
  requestPasswordReset(email: String!): UserResponse

  """Public."""
  setPassword(input: SetPasswordInput!): UserResponse

  """Authenticated."""
  changeMyPassword(input: ChangePasswordInput!): UserResponse

  """Authenticated."""
  beginMfaEnrollment: MfaSetupResponse

  """Authenticated."""
  confirmMfaEnrollment(otp: String!): MfaRecoveryResponse

  """Authenticated."""
  regenerateMfaRecoveryCodes(otp: String!): MfaRecoveryResponse

  """Authenticated."""
  disableMfa(otp: String!): UserResponse

  """Authenticated."""
  revokeMySession(sessionId: String!): RevokedSessionsResponse

  """Authenticated."""
  revokeAllMySessions(includeCurrent: Boolean = false): RevokedSessionsResponse

  """permissions=['can_reset_user_mfa','can_edit_user']"""
