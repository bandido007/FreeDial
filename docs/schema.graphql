  requireUserPasswordChange(uid: UUID!): UserResponse

  """permissions=['can_revoke_user_sessions']"""
  revokeUserSessions(uid: UUID!): RevokedSessionsResponse

  """permissions=['can_manage_ldap_config']"""
  createLdapConfig(input: LdapConfigInput!): LdapConfigResponse

  """permissions=['can_manage_ldap_config']"""
  updateLdapConfig(input: LdapConfigInput!): LdapConfigResponse

  """permissions=['can_manage_ldap_config']"""
  deleteLdapConfig(uid: UUID!): LdapConfigResponse

  """permissions=['can_pull_ldap_users']"""
  pullLdapUsers(configUid: UUID!): UserResponse
  createRole(input: RoleInput!): RoleResponse
  updateRole(input: RoleInput!): RoleResponse
  deleteRole(uid: UUID!): RoleResponse
  assignPermissionsToRole(input: RoleInput!): RoleResponse

  """Public. Create my own account."""
  register(input: RegisterInput!): UserResponse

