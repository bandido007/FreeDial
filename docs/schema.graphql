"""The unified root query, composed from every app's Query."""
type Query {
  """
  Calls offered, answered, abandoned and overflowed, waits and service level. permissions=['can_view_queues']
  """
  getQueueStats(
    uid: UUID!

    """Default: today at midnight"""
    since: DateTime

    """Default: now"""
    until: DateTime
  ): QueueStatsResponse

  """
  The signed-in agent, their live state, Not Ready reasons and wrap-up codes. permissions=['can_take_calls']
  """
  myAgentDesk: AgentDeskResponse

  """One team with its members. permissions=['can_view_teams']"""
  getTeam(uid: UUID!): TeamResponse

  """Paginated, searchable teams. permissions=['can_view_teams']"""
  getTeamsPageable(searchDto: SearchDataDto!, filtering: TeamFilterInput): TeamPageResponse

  """One SIP account. permissions=['can_view_sip_accounts']"""
  getSipAccount(uid: UUID!): SipAccountResponse

  """
  Paginated, searchable SIP accounts. permissions=['can_view_sip_accounts']
  """
  getSipAccountsPageable(searchDto: SearchDataDto!, filtering: SipAccountFilterInput): SipAccountPageResponse

  """
  Every runtime setting with its value. permissions=['can_view_system_settings','can_manage_system_settings']
  """
  getSystemSettings(
    """Only the settings of this group"""
    group: String
  ): SystemSettingResponse

  """
  The settings the sign-in page needs (name, logo, support contact). Public.
  """
  getPublicSettings: PublicSettingsResponse

  """
  The attachment-type catalogue (incl. inactive). permissions=['can_view_attachment_settings']
  """
  getAttachmentDefinitions(filtering: AttachmentDefinitionFilterInput): AttachmentDefinitionResponse

  """
  Active attachment types, for forms that ask for documents. Authenticated.
  """
  getActiveAttachmentDefinitions: AttachmentDefinitionResponse

  """
  Counters for the Attachment types dashboard. permissions=['can_view_attachment_settings']
  """
  getAttachmentStats: AttachmentStatsResponse

  """
  The file types a definition may accept, per kind — the same set the upload endpoint enforces. permissions=['can_view_attachment_settings']
  """
  getAllowedFileExtensions: AllowedFileExtensionResponse

  """The files I uploaded. Authenticated."""
  getMyAttachmentsPageable(searchDto: SearchDataDto!, filtering: AttachmentFilterInput): AttachmentPageResponse

  """Every stored file. permissions=['can_view_all_attachments']"""
  getAttachmentsPageable(searchDto: SearchDataDto!, filtering: AttachmentFilterInput): AttachmentPageResponse

  """
  The files attached to one record that I am allowed to open. Authenticated.
  """
  getEntityAttachments(entityType: String!, entityUid: UUID!): AttachmentResponse

  """System-wide change trail. permissions=['can_view_audit_logs']"""
  getAuditLogsPageable(searchDto: SearchDataDto!, filtering: AuditLogFilterInput): AuditLogPageResponse

  """
  Everything that happened to one record, oldest first. permissions=['can_view_audit_logs']
  """
  getRecordHistory(
    """
    Model label, e.g. "users.User"
    """
    entity: String!
    objectUid: UUID!
  ): AuditLogResponse

  """Model labels present in the trail. permissions=['can_view_audit_logs']"""
  getAuditedEntities: [String]

  """
  The change trail as a downloadable file, honouring the same filters. permissions=['can_export_audit_logs']
  """
  exportAuditLogs(format: TableExportFormatChoices!, filtering: AuditLogFilterInput): ExportFileResponse

  """
  Endpoint transaction log — ERROR level only (defects a developer must fix); INFO/WARNING rows never surface here. permissions=['can_view_endpoint_logs']
  """
  getEndpointLogsPageable(searchDto: SearchDataDto!, filtering: EndpointLogFilterInput): RequestLogPageResponse

  """
  Counters for the audit dashboard. permissions=['can_view_audit_logs','can_view_endpoint_logs']
  """
  getAuditStats: AuditStatsResponse

  """
  Users subscribed to the daily error report. permissions=['can_manage_endpoint_logs']
  """
  getErrorReportRecipients: ErrorReportSubscriptionResponse

  """The signed-in user's own action trail. Any authenticated user."""
  getMyActivityPageable(searchDto: SearchDataDto!, filtering: AuditLogFilterInput): AuditLogPageResponse

  """
  Paginated notification log (all channels/statuses). permissions=['can_view_notifications']
  """
  getNotificationsPageable(searchDto: SearchDataDto!, filtering: NotificationFilterInput): NotificationPageResponse

  """All notifications addressed to me. Authenticated."""
  getMyNotifications: NotificationResponse

  """My in-app notifications. Authenticated."""
  getMyInAppNotifications: NotificationResponse

  """My in-app notifications, page by page. Authenticated."""
  getMyInAppNotificationsPageable(searchDto: SearchDataDto!, unreadOnly: Boolean = false): NotificationPageResponse

  """How many in-app notifications I have not read. Authenticated."""
  getMyUnreadNotificationCount: UnreadCountResponse

  """
  Every category on every channel, with my current choice. Authenticated.
  """
  getMyNotificationPreferences: NotificationPreferenceResponse

  """SMTP configurations. permissions=['can_manage_notification_config']"""
  getEmailConfigurations: EmailConfigurationResponse

  """
  SMS gateway configurations. permissions=['can_manage_notification_config']
  """
  getSmsConfigurations: SmsConfigurationResponse

  """
  Gateway implementations available. permissions=['can_manage_notification_config']
  """
  getSmsProviders: SmsProviderResponse

  """
  Notification content templates. permissions=['can_manage_notification_config']
  """
  getNotificationTemplates: NotificationTemplateResponse

  """The kinds of message the system can send. Authenticated."""
  getNotificationCategories: NotificationCategoryResponse

  """
  Current user: identity, account type, authorities, roles and any restriction.
  """
  meQuery: LoggedInUserResponse

  """External providers the sign-in page can offer. Public."""
  getSignInProviders: SignInProviderResponse

  """The current user's live sign-in sessions (access tokens)."""
  getMySessions: SessionResponse

  """The signed-in user's own sign-in history. Any authenticated user."""
  getMyLoginHistoryPageable(searchDto: SearchDataDto!, filtering: LoginHistoryFilterInput): UserLoginHistoryPageResponse

  """The signed-in user's own security events. Any authenticated user."""
  getMySecurityEventsPageable(searchDto: SearchDataDto!, filtering: AuthenticationEventFilterInput): AuthenticationAuditPageResponse

  """
  System-wide sign-in history. permissions=['can_view_login_history','can_view_audit_logs']
  """
  getLoginHistoryPageable(searchDto: SearchDataDto!, filtering: LoginHistoryFilterInput): UserLoginHistoryPageResponse

  """
  Every security event: sign-ins, failures, password and two-factor changes. permissions=['can_view_login_history','can_view_audit_logs']
  """
  getAuthenticationEventsPageable(searchDto: SearchDataDto!, filtering: AuthenticationEventFilterInput): AuthenticationAuditPageResponse

  """Directory (LDAP) configurations. permissions=['can_view_ldap_config']"""
  getLdapConfigs(filtering: LdapConfigFilterInput): LdapConfigResponse

  """Paginated, searchable list of roles. permissions=['can_view_roles']"""
  getAllRolesPageable(searchDto: SearchDataDto!, filtering: RoleFilterInput): RolePageResponse

  """One role with its permissions. permissions=['can_view_roles']"""
  getRole(uid: UUID!): RoleResponse

  """
  All permission groups with their permissions. permissions=['can_view_roles']
  """
  getAllPermissionGroups: PermissionGroupResponse

  """
  Paginated, filterable directory of users. permissions=['can_view_users']
  """
  getAllUsersPageable(searchDto: SearchDataDto!, filtering: UserFilterInput): UserPageResponse

  """A single user with their roles. permissions=['can_view_users']"""
  getUser(uid: UUID!): UserResponse

  """
  The user listing as a downloadable file (PDF / EXCEL / CSV / WORD), honouring the same filters as the pageable query. permissions=['can_export_users']
  """
  exportUsers(format: TableExportFormatChoices!, filtering: UserFilterInput): ExportFileResponse

  """A user's legal-consent history (audit). permissions=['can_view_users']"""
  getUserConsents(userUid: UUID!): UserConsentResponse

  """A portable snapshot of the caller's personal data."""
  exportMyData: MyDataExportResponse

  """
  Whether people may create their own account, and the policy versions. Public.
  """
  getRegistrationStatus: RegistrationStatusResponse
}

